<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Good News">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Good News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 손 모바일 앱: 위 키 그림(종이 카드) · 가운데 설명 · 아래 고정 조작 바 */
:root{
  --bg:#e7eef0;      /* 바다 안개 */
  --paper:#fbfaf5;   /* 그림 종이 */
  --ink:#1b2a37;     /* 남색 잉크 */
  --muted:#5a6873;
  --line:#d2dadd;
  --accent:#9c561c;  /* 키 손잡이 나무색 */
  --stroke:#33424f;  /* 그림 외곽선 */
  --hl:#fde7a0;      /* 읽는 문장 */
  --btn:#1b2a37; --btn-fg:#fbfaf5;
  --chip:#ffffff;
  --me-bg:#f5e4d2;   /* 전도자 말풍선 */
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a23; --paper:#15242f; --ink:#e6edef; --muted:#9fb0ba; --line:#28404e;
  --accent:#e0a36b; --stroke:#c8d4da; --hl:#5b4a14; --btn:#e6edef; --btn-fg:#0e1a23; --chip:#1b2d39; --me-bg:#3b2b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a23; --paper:#15242f; --ink:#e6edef; --muted:#9fb0ba; --line:#28404e;
  --accent:#e0a36b; --stroke:#c8d4da; --hl:#5b4a14; --btn:#e6edef; --btn-fg:#0e1a23; --chip:#1b2d39; --me-bg:#3b2b1d; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;
  padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px}
header .tabs{flex:1 0 100%}
header h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em}
header h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
#install{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.8rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--muted);
  border-radius:999px;padding:3px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.chips button.done{color:var(--ink)}
.chips button.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.board{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;justify-content:center}
#key{width:100%;max-width:min(100%,56vh);aspect-ratio:1;height:auto;display:block;color:var(--ink)}
.text{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.tag{font-size:.78rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
.text h2{font-family:var(--f-display);font-size:1.35rem;margin:0;line-height:1.35;text-wrap:balance}
.draw{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
#say{margin:4px 0 0;font-size:1.05rem}
#say span{border-radius:4px;transition:background .2s}
#say span.now{background:var(--hl)}
body.hide #say{filter:blur(6px);user-select:none}
body.hide #say:active{filter:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);
  padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row.opts{justify-content:space-between;flex-wrap:wrap;font-size:.85rem}
.btn{flex:1;border:0;border-radius:14px;padding:13px 6px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
  background:var(--chip);color:var(--ink);border:1px solid var(--line);min-height:50px}
.btn.main{flex:1.5;background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.all{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.chips button:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--chip);color:var(--muted);font:inherit;font-size:.8rem;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btn-fg)}
label.tg{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted)}
/* 메뉴 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;border-radius:10px;padding:9px 6px;font:inherit;font-weight:700;font-size:.95rem;background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--btn);color:var(--btn-fg)}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 전도 샘플 */
body.sample .board{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px));z-index:4;padding:6px}
body.sample #key{max-width:min(100%,34vh)}
.scene{display:flex;flex-direction:column;gap:4px;padding:2px}
.scene h2{font-family:var(--f-display);font-size:1.25rem;margin:0}
.scene p{margin:0;font-size:.92rem;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
#talk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:88%;min-width:0;scroll-margin-bottom:170px;scroll-margin-top:45vh}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.you{align-self:flex-start}
.msg.later{display:none}
.msg .name{font-size:.75rem;color:var(--muted)}
.bub{padding:10px 14px;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-size:1rem;line-height:1.65;cursor:pointer}
.me .bub{background:var(--me-bg);border-color:transparent;border-bottom-right-radius:4px}
.you .bub{border-bottom-left-radius:4px}
.msg.pray .bub{border:1.5px dashed var(--accent);font-family:var(--f-display)}
.msg.now .bub{box-shadow:0 0 0 2.5px var(--accent)}
.tip{font-size:.8rem;color:var(--accent);max-width:100%}
.tip b{font-weight:700}
body.hide .msg .bub{filter:blur(5px)}
body.hide .msg.now .bub:active{filter:none}
.after{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.after h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.after dl{margin:0;display:flex;flex-direction:column;gap:8px}
.after dt{font-weight:700;font-size:.92rem}
.after dd{margin:0;font-size:.92rem;color:var(--muted)}
/* 그림 애니메이션 */
#key .outline{fill:none;stroke:var(--stroke);stroke-width:1.5}
#key .cap{fill:currentColor;font-family:var(--f-display);font-size:21px;font-weight:700}
#key .lbl text{fill:#1b2a37;font-family:var(--f-body)}
#key .new .outline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease forwards}
#key .new .scrib{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .55s ease-in-out forwards}
#key .new .lbl,#key .new.capg{opacity:0;animation:fade .6s 1.5s forwards}
#key .cur .fill{filter:drop-shadow(0 0 5px rgba(255,190,60,.8))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  #key .new .outline,#key .new .scrib{animation:none;stroke-dashoffset:0}
  #key .new .lbl,#key .new.capg{animation:none;opacity:1}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Good News<small>키 그림으로 전하는 복음</small></h1>
    <div class="row"><button id="install" hidden>앱 설치</button><span class="count" id="count">0 / 16</span></div>
    <nav class="tabs" id="tabs" aria-label="메뉴"><button data-m="learn">키 그림 배우기</button><button data-m="sample">전도 샘플</button></nav>
  </header>
  <nav class="chips" id="chips" aria-label="단계"></nav>
  <div class="board"><svg id="key" viewBox="-218 -218 436 436" role="img" aria-label="키 그림"></svg></div>
  <section class="text" aria-live="polite">
    <div class="tag" id="tag"></div>
    <h2 id="title"></h2>
    <div class="draw" id="draw"></div>
    <p id="say"></p>
  </section>
  <section id="sampleView" hidden>
    <div class="scene">
      <div class="tag" id="sTag">전도 샘플</div>
      <h2 id="sTitle"></h2>
      <p id="sScene"></p>
      <div class="legend"><span><i style="background:var(--me-bg)"></i>나(전도자)</span><span><i style="background:var(--chip)"></i><span id="sYou"></span></span></div>
    </div>
    <ol id="talk"></ol>
    <div class="after" id="after" hidden>
      <h3>이럴 땐 이렇게</h3>
      <dl id="faq"></dl>
    </div>
  </section>
  <p class="note" id="tts-note" hidden>이 기기에서는 음성 읽기를 쓸 수 없어 글만 보여 줍니다.</p>
</div>

<div class="bar"><div class="in">
  <div class="row opts">
    <span class="seg" id="rate" aria-label="말하기 속도">
      <button data-r="0.8">느리게</button><button data-r="1">보통</button><button data-r="1.2">빠르게</button>
    </span>
    <label class="tg"><input type="checkbox" id="loop"> 반복</label>
    <label class="tg"><input type="checkbox" id="hide"> 글 가리기</label>
  </div>
  <div class="row">
    <button class="btn" id="prev" aria-label="이전 단계">◀ 이전</button>
    <button class="btn all" id="all">전체듣기</button>
    <button class="btn main" id="next">Next ▶</button>
  </div>
</div></div>

<script>
/* ===== 데이터: 단계(STEPS) — 그림 단계 번호(n)는 아래 PARTS의 from/to와 맞춘다 ===== */
const STEPS = [
 {tag:"GOOD NEWS", title:"키 그림으로 전하는 기쁜 소식", draw:"완성된 키 그림입니다. Next를 누르면 처음부터 한 단계씩 그립니다.",
  say:"굿 뉴스, 키 그림으로 전하는 기쁜 소식입니다. 이 그림은 배를 움직이는 키를 닮았습니다. 다음 버튼을 누르면 한 단계씩 그림을 그리며 설명을 듣고, 전체듣기를 누르면 처음부터 끝까지 이어서 들을 수 있습니다."},
 {tag:"그리기 1", title:"자아가 다스리는 삶", draw:"큰 원 안에 작은 원 · 가운데 '자아' · 아래 '나의 의지, 나의 소망'",
  say:"먼저 큰 원 안에 작은 원을 그리고, 가운데에 자아라고 씁니다. 큰 원 아래에는 나의 의지, 나의 소망이라고 씁니다. 이 그림은 예수님을 믿기 전의 사람입니다. 삶의 왕좌에 내가 앉아서, 모든 것을 내 뜻과 내 바람대로 정하는 자기중심의 삶입니다."},
 {tag:"그리기 2", title:"예수님이 중심에 계신 삶", draw:"작은 원 가운데 '예수님' · 아래 '그분의 의지, 그분의 소망'",
  say:"이번에는 작은 원 가운데에 예수님이라고 씁니다. 큰 원 아래에는 그분의 의지, 그분의 소망이라고 씁니다. 예수님을 마음에 모셔 들인 사람의 모습입니다. 이제 삶의 왕좌에는 예수님이 계시고, 그분의 뜻을 따르는 그리스도 중심의 삶이 시작됩니다."},
 {tag:"그리기 3", title:"구원의 확신", draw:"예수님 둘레에 원을 하나 더 그려 반으로 나누고 위쪽에 '구원의 확신'",
  say:"예수님 원 둘레에 원을 하나 더 그리고 반으로 나눕니다. 위쪽에는 구원의 확신이라고 씁니다. 그리스도 중심의 삶은, 내가 하나님의 자녀가 되었다는 분명한 확신에서 출발합니다."},
 {tag:"그리기 4", title:"하나님의 성품", draw:"아래쪽에 '하나님의 성품'",
  say:"아래쪽에는 하나님의 성품이라고 씁니다. 하나님이 어떤 분이신지 알아 갈수록, 내 삶 속에 계신 그리스도를 더 깊이 알게 됩니다."},
 {tag:"그리기 5", title:"여덟 가지 삶의 영역", draw:"바깥 원을 여덟 칸으로 나누기",
  say:"이제 바깥 원을 여덟 칸으로 나눕니다. 이 여덟 칸은 예수님 중심의 삶을 이루는 여덟 가지 영역입니다. 위쪽 오른편부터 시계 방향으로 하나씩 채워 보겠습니다."},
 {tag:"영역 1", title:"성경", draw:"첫째 칸에 '성경'",
  say:"첫째, 성경입니다. 우리는 성경을 통해 하나님을 알 수 있습니다. 하나님은 성경으로 우리에게 말씀하시고, 성경은 그리스도인의 삶을 이끄는 기본 지침서입니다."},
 {tag:"영역 2", title:"기도", draw:"둘째 칸에 '기도'",
  say:"둘째, 기도입니다. 기도는 하나님과 나누는 대화입니다. 성경으로 하나님의 말씀을 듣고 기도로 내 마음을 아뢸 때, 하나님과의 수직적인 관계가 더욱 깊어집니다."},
 {tag:"영역 3", title:"교제", draw:"셋째 칸에 '교제'",
  say:"셋째, 교제입니다. 하나님과 바른 관계를 맺으면 사람들과도 바른 관계를 맺을 수 있습니다. 성도들과 그리스도 안에서 서로 돌아보며, 믿음을 세워 주는 교제를 나눕니다."},
 {tag:"영역 4", title:"전도", draw:"넷째 칸에 '전도'",
  say:"넷째, 전도입니다. 아직 예수님을 모르는 이웃에게 예수님을 전합니다. 그들도 하나님과 인격적인 관계를 맺을 수 있도록 돕는 것입니다."},
 {tag:"영역 5", title:"성령 충만", draw:"다섯째 칸에 '성령 충만'",
  say:"다섯째, 성령 충만입니다. 성령님이 다스리시고 예수님이 중심 되시는 삶이 무엇인지 배우고, 날마다 그렇게 살아갑니다."},
 {tag:"영역 6", title:"시험", draw:"여섯째 칸에 '시험'",
  say:"여섯째, 시험입니다. 시험을 받지 않는 사람은 없습니다. 그러나 하나님은 우리를 건져 주십니다. 영적인 싸움에 대한 성경의 가르침을 붙듭니다."},
 {tag:"영역 7", title:"순종", draw:"일곱째 칸에 '순종'",
  say:"일곱째, 순종입니다. 예수님 중심의 삶을 살려면, 지금까지 배운 모든 가르침에 순종으로 응답해야 합니다."},
 {tag:"영역 8", title:"사역", draw:"여덟째 칸에 '사역'",
  say:"여덟째, 사역입니다. 순종하는 사람을 하나님은 새로운 사역으로 이끄십니다."},
 {tag:"그리기 6", title:"예수님이 다스리는 삶", draw:"겉에 원을 하나 더 · 위 '예수님이' · 아래 '다스리는 삶'",
  say:"가장 바깥에 원을 하나 더 그리고, 위와 아래에 예수님이 다스리는 삶이라고 씁니다. 하나님을 알고 그분께 순종할수록, 삶의 모든 영역이 점점 더 예수님 중심으로 바뀌어 갑니다."},
 {tag:"그리기 7", title:"키의 손잡이", draw:"원 바깥에 손잡이 여덟 개",
  say:"마지막으로 키에 손잡이를 그립니다. 이 그림은 배의 키입니다. 항해사가 키를 잡고 배를 항로대로 이끌듯, 우리 삶의 모든 부분을 그리스도께 맡겨 그분이 다스리시게 합시다."},
 {tag:"암송 정리", title:"키 그림 한눈에", draw:"중심 · 안쪽 원 · 여덟 영역 · 바깥 원",
  say:"이제 키 그림을 정리합니다. 가운데에는 예수님. 안쪽 원 위에는 구원의 확신, 아래에는 하나님의 성품. 여덟 영역은 성경, 기도, 교제, 전도, 성령 충만, 시험, 순종, 사역. 바깥 원은 예수님이 다스리는 삶. 손잡이를 잡고 예수님께 삶의 키를 맡겨 드립시다."}
];

/* ===== 그림 ===== */
const COL = {self:"#CFCFCF", jesus:"#FFD45E", sure:"#FBE3A0", char:"#F8CDB8", rim:"#C68A55", handle:"#8A5A36"};
const SEG = [["성경","#F4C95D"],["기도","#93C5E8"],["교제","#9FD39B"],["전도","#F3A367"],
             ["성령 충만","#F28B82"],["시험","#B9A3E3"],["순종","#7FD1C1"],["사역","#E7A6C8"]];
const R0=46, R1=86, R2=150, R3=178;

function sector(r1,r2,a1,a2){const L=(a2-a1)>180?1:0,[x1,y1]=P(r2,a1),[x2,y2]=P(r2,a2),[x3,y3]=P(r1,a2),[x4,y4]=P(r1,a1);
  return `M${x1},${y1}A${r2},${r2} 0 ${L} 1 ${x2},${y2}L${x3},${y3}A${r1},${r1} 0 ${L} 0 ${x4},${y4}Z`;}
function arcPath(r,a1,a2,sweep){const [x1,y1]=P(r,a1),[x2,y2]=P(r,a2);return `M${x1},${y1}A${r},${r} 0 0 ${sweep} ${x2},${y2}`;}

const LAST = STEPS.length-1;
function visible(p,s){ if(s<0) return false; if(s===0) return p.to==null; return p.from<=s && (p.to==null || s<=p.to); }
function renderKey(s, animate){
  const svg=document.getElementById("key"); let out="";
  PARTS.forEach((p,k)=>{
    if(!visible(p,s)) return;
    const isNew = animate && p.from===s && s!==0;
    if(p.cap){ out+=`<g class="capg${isNew?" new":""}"><text class="cap" x="0" y="${R2+38}" text-anchor="middle">${p.cap}</text></g>`; return; }
    const cls=["part"]; if(isNew) cls.push("new"); if(p.from===s && s!==0 && s!==LAST) cls.push("cur");
    out+=`<g class="${cls.join(" ")}"${p.tf?` transform="${p.tf}"`:""}>`;
    if(p.fill!=="none"){
      if(isNew) out+=`<mask id="m${k}" maskUnits="userSpaceOnUse" x="-230" y="-230" width="460" height="460"><path class="scrib" data-for="f${k}" pathLength="1" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/></mask>`;
      out+=`<path id="f${k}" class="fill" d="${p.d}" fill="${p.fill}" fill-rule="${p.rule||"nonzero"}"${isNew?` mask="url(#m${k})"`:""}/>`;
    }
    out+=`<path class="outline" d="${p.d}" pathLength="1"/>`;
    if(p.lbl) out+=`<g class="lbl">${p.lbl}</g>`;
    out+=`</g>`;
  });
  if(s<0) out=`<text class="cap" x="0" y="0" text-anchor="middle" opacity=".45">대화를 따라 여기에 키 그림을 그립니다</text>`;
  svg.innerHTML=out;
  // 크레용 색칠: 칠할 모양의 범위를 지그재그로 덮는다
  svg.querySelectorAll(".scrib").forEach(sc=>{
    const f=svg.querySelector("#"+sc.dataset.for); if(!f) return;
    const b=f.getBBox(), gap=Math.max(9,Math.min(b.width,b.height)/6), sw=gap*1.9;
    let d=`M${b.x-sw},${b.y}`, dn=true;
    for(let x=b.x-sw; x<=b.x+b.width+sw; x+=gap){ d+=`L${x+gap/2},${dn?b.y+b.height+sw/2:b.y-sw/2}`; dn=!dn; }
    sc.setAttribute("d",d); sc.setAttribute("stroke-width",sw);
  });
}

let rate=store.get("rate",1), cur=0, playing=false, token=0, wake=null;

/* ===== 음성 ===== */
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let koVoice=null, koVoice2=null;
function pickVoice(){ if(!synth) return; const vs=synth.getVoices();
  koVoice = vs.find(v=>/ko[-_]KR/i.test(v.lang)&&/female|yuna|sunhi|heami|google/i.test(v.name)) || vs.find(v=>/^ko/i.test(v.lang)) || null;
  koVoice2 = vs.find(v=>/^ko/i.test(v.lang) && v!==koVoice) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; } else document.getElementById("tts-note").hidden=false;
const sentences=t=>(t.match(/[^.?!]+[.?!]?/g)||[]).map(x=>x.trim()).filter(Boolean);
function est(t){ return (t.replace(/\s/g,"").length*190)/rate + 500; }
function speakOne(text, cb, o={}){
  if(!synth){ setTimeout(cb, est(text)); return; }
  let done=false; const fin=()=>{ if(done) return; done=true; clearTimeout(w); cb(); };
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; const vv=o.voice||koVoice; if(vv) u.voice=vv; u.rate=rate*(o.rf||1); u.pitch=o.pitch||1; u.onend=fin; u.onerror=fin;
  const w=setTimeout(fin, est(text)*2.2+3000);   // onend가 안 오는 기기 대비
  synth.speak(u);
}
function stopSpeech(){ token++; if(synth) synth.cancel(); markSent(-1); }
function markSent(i){ document.querySelectorAll("#say span").forEach((s,k)=>s.classList.toggle("now",k===i)); }
function say(i, done){
  stopSpeech(); const my=token, list=sentences(STEPS[i].say); let k=0;
  (function next(){
    if(my!==token) return;
    if(k>=list.length){ markSent(-1); done&&done(); return; }
    markSent(k); speakOne(list[k], ()=>{ if(my!==token) return; k++; setTimeout(next,180); });
  })();
}

  const i=idx(), L=last();
  $("count").textContent = mode==="learn" ? `${i} / ${L}` : `${i+1} / ${L+1}`;
  $("prev").disabled = i===0;
  $("next").textContent = i===L ? "처음으로" : "Next ▶";
}
function setMode(m){
  stopAll(); mode=m; store.set("mode",m);
  document.body.classList.toggle("sample",m==="sample");
  [...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  chips.hidden = m!=="learn"; document.querySelector(".text").hidden = m!=="learn"; $("sampleView").hidden = m!=="sample";
  showAt(idx(), false);
  if(m==="sample") $("ln"+sIdx).scrollIntoView({block:"end"}); else window.scrollTo(0,0);
}
$("tabs").onclick=e=>{ const b=e.target.closest("button"); if(b && b.dataset.m!==mode) setMode(b.dataset.m); };
const fitHdr=()=>document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight+"px");
addEventListener("resize",fitHdr);

async function lockScreen(on){ try{ if(on && navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); else if(wake){ wake.release(); wake=null; } }catch(e){} }
function playAll(){
  playing=true; $("all").textContent="■ 멈춤"; lockScreen(true);
  if(mode==="learn" && (cur===0||cur===LAST)) show(1,true);
  if(mode==="sample" && sIdx===SLAST) showLine(0,true);
  run();
}
function run(){
  sayAt(idx(), ()=>{ if(!playing) return;
    setTimeout(()=>{ if(!playing) return;
      if(idx()<last()){ showAt(idx()+1,true); run(); }
      else if($("loop").checked){ showAt(mode==="learn"?1:0,true); run(); }
      else stopAll();
    }, mode==="learn"?1300:650);
  });
}
function stopAll(){ playing=false; $("all").textContent="전체듣기"; lockScreen(false); stopSpeech(); }

$("next").onclick=()=>{ stopAll(); go(idx()===last()?0:idx()+1); };
$("prev").onclick=()=>{ stopAll(); if(idx()>0) go(idx()-1); };
$("all").onclick=()=>{ playing?stopAll():playAll(); };
$("say").onclick=()=>{ if(!playing) say(cur); };   // 글을 누르면 다시 듣기
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") $("next").click(); if(e.key==="ArrowLeft") $("prev").click(); });

const rateBox=$("rate");
function paintRate(){ [...rateBox.children].forEach(b=>b.classList.toggle("on",+b.dataset.r===rate)); }
rateBox.onclick=e=>{ const b=e.target.closest("button"); if(!b) return; rate=+b.dataset.r; store.set("rate",rate); paintRate(); if(!playing && synth && synth.speaking) sayAt(idx()); };
paintRate();
$("loop").checked=store.get("loop",false); $("loop").onchange=e=>store.set("loop",e.target.checked);
$("hide").checked=store.get("hide",false); document.body.classList.toggle("hide",$("hide").checked);
$("hide").onchange=e=>{ store.set("hide",e.target.checked); document.body.classList.toggle("hide",e.target.checked); };

/* 앱 설치(PWA) */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("install").hidden=false; });
$("install").onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $("install").hidden=true; };

cur=Math.min(store.get("step",0),LAST);
fitHdr(); setMode(mode);
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
